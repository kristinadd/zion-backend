static_resources:
  # LISTENERS: Where Envoy receives incoming requests
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0          # Listen on all network interfaces
        port_value: 15001         # Envoy will listen on port 15001
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: ledger_backend
              domains: ["*"]      # Accept all domains
              routes:
              # Route 1: Balance API
              - match:
                  prefix: "/api/v1/balances"    # Match requests to /api/v1/balances*
                route:
                  cluster: ledger_service       # Forward to "ledger_service" cluster
                  timeout: 15s                  # Total timeout for request
                  retry_policy:
                    retry_on: "5xx"             # Retry on 5xx errors
                    num_retries: 3              # Retry up to 3 times
                    per_try_timeout: 5s         # Each retry has 5s timeout
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          # Access logging to see requests flowing through Envoy
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format: |
                  [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%"
                  %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION%ms
                  upstream: %UPSTREAM_CLUSTER% → %UPSTREAM_HOST%

  # CLUSTERS: Where Envoy forwards requests to
  clusters:
  - name: ledger_service           # This is the name we referenced above
    type: STRICT_DNS               # Use DNS to find the service
    connect_timeout: 5s            # How long to wait for connection
    load_assignment:
      cluster_name: ledger_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                # Running locally, so using localhost as the address
                address: localhost   # Ledger service runs on localhost
                port_value: 3000     # Ledger service listens on port 3000

# Admin interface for monitoring Envoy
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901  # Admin UI will be at http://localhost:9901

