static_resources:
  # LISTENER: Rails app sends requests here
  listeners:
  - name: egress_listener
    address:
      socket_address:
        address: 127.0.0.1         # Only listen on localhost (sidecar pattern)
        port_value: 15001          # Rails will call localhost:15001
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress_http
          codec_type: AUTO
          route_config:
            name: egress_route
            virtual_hosts:
            - name: ledger_backend
              domains: ["*"]
              routes:
              # Route to Ledger Service (via its sidecar)
              - match:
                  prefix: "/api/v1/balances"
                route:
                  cluster: ledger_service_ingress
                  timeout: 15s
                  retry_policy:
                    retry_on: "5xx,connect-failure,refused-stream"
                    num_retries: 3
                    per_try_timeout: 5s
                # Add internal security header
                request_headers_to_add:
                - header:
                    key: "X-Internal-Secret"
                    value: "zion-internal-secret-2024"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
              - match:
                  prefix: "/api/v1/entry_sets"
                route:
                  cluster: ledger_service_ingress
                  timeout: 15s
                  retry_policy:
                    retry_on: "5xx,connect-failure,refused-stream"
                    num_retries: 3
                    per_try_timeout: 5s
                # Add internal security header
                request_headers_to_add:
                - header:
                    key: "X-Internal-Secret"
                    value: "zion-internal-secret-2024"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          # Access logging
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format: |
                  [ZION-BACKEND EGRESS] [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  %RESPONSE_CODE% %DURATION%ms → %UPSTREAM_CLUSTER%

  # CLUSTERS: Where to send traffic
  clusters:
  - name: ledger_service_ingress
    type: STATIC
    connect_timeout: 5s 
    load_assignment:
      cluster_name: ledger_service_ingress
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                # Connect to Ledger's INGRESS SIDECAR (not ledger directly!)
                address: 127.0.0.1
                port_value: 14001      # Ledger's Envoy sidecar port
    # Health checks
    health_checks:
    - timeout: 1s
      interval: 6000s # 100 minutes
      unhealthy_threshold: 2
      healthy_threshold: 2
      http_health_check:
        path: "/api/v1/balances/available"

# Admin interface
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901  # Rails sidecar admin

